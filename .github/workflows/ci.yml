name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    # Windows is a supported platform (the README documents the PowerShell
    # install path and several modules carry win32 branches), so it has to be
    # tested.  Two shipped bugs were invisible on Linux because of this:
    # headless mode closing sys.stdout, and read_piped_stdin hanging forever
    # on a pipe that is open but never written to.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests + eval suite (tests/test_evals.py)
        run: pytest -q
      # One platform is enough for the two style gates below; running them in
      # every matrix cell just burns minutes.
      - name: Lint (flake8)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m flake8 neow
      - name: Format check (black)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m black --check .
